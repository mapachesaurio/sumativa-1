<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MangaVerse - Lector</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { 
      background:#0a0f1c; 
      margin:0; 
      padding:0; 
      overflow-x:hidden; 
    }
    .reader-header, .reader-footer {
      position:fixed; left:0; right:0; background:#0f172a; z-index:1000;
      transition: transform 0.4s ease;
    }
    .reader-header { top:0; padding:12px 20px; display:flex; align-items:center; gap:15px; border-bottom:1px solid #334155; }
    .reader-footer { bottom:0; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; border-top:1px solid #334155; }

    .hidden { transform: translateY(-100%); }
    .reader-footer.hidden { transform: translateY(100%); }

    .reader-main { 
      margin-top:65px; 
      padding:10px 0; 
      width: 100%; 
    }
    .page-container { 
      display:flex; 
      flex-direction:column; 
      gap:0px; 
      align-items:center; 
      max-width: 600px;          /* ← reducido más */
      margin: 0 auto;
    }
    .page-container img {
      width: 100%; 
      max-width: 720px;
      height: auto;
      display: block;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    .progress-bar { height:6px; background:#334155; border-radius:9999px; overflow:hidden; flex:1; margin:0 15px; }
    .progress { height:100%; background:#e11d48; width:0%; transition:width 0.3s; }
    .btn-control { 
      background:#1e2937; color:#e2e8f0; border:none; padding:10px 18px; 
      border-radius:8px; cursor:pointer; font-size:1.1rem; 
    }
    .btn-control:hover { background:#e11d48; }
  </style>
</head>
<body>

  <div class="reader-header" id="header">
    <a href="#" onclick="goBack()" class="btn-control"><i class="fas fa-arrow-left"></i></a>
    <div>
      <h2 id="mangaTitle" style="margin:0; font-size:1.4rem;">El Mago Pastor</h2>
      <p id="chapterInfo" style="margin:0; color:#94a3b8; font-size:0.95rem;"></p>
    </div>
    <div style="margin-left:auto; display:flex; align-items:center; gap:12px;">
      <button onclick="prevPage()" class="btn-control"><i class="fas fa-chevron-left"></i></button>
      <span id="pageCounter" style="font-weight:600; min-width:90px; text-align:center;">1 / 59</span>
      <button onclick="nextPage()" class="btn-control"><i class="fas fa-chevron-right"></i></button>
    </div>
  </div>

  <div class="reader-main">
    <div id="pages" class="page-container"></div>
  </div>

  <div class="reader-footer" id="footer">
    <button onclick="prevChapter()" class="btn-control"><i class="fas fa-step-backward"></i> Cap. anterior</button>
    <div class="progress-bar"><div id="progress" class="progress"></div></div>
    <button onclick="nextChapter()" class="btn-control">Cap. siguiente <i class="fas fa-step-forward"></i></button>
  </div>

  <script>
    const mangaFolder = "El_mago_pastor";
    let chapter = 1;
    let currentPage = 1;
    const totalPages = 59;

    function pad(num) { return String(num).padStart(3, '0'); }

    function renderPages() {
      const container = document.getElementById('pages');
      container.innerHTML = '';
      const chapterPadded = pad(chapter);
      for (let i = 1; i <= totalPages; i++) {
        const pagePadded = pad(i);
        const img = document.createElement('img');
        img.src = `${mangaFolder}/Cap_${chapterPadded}/${pagePadded}.jpg`;
        img.alt = `Página ${i}`;
        img.onerror = () => img.style.display = 'none';
        container.appendChild(img);
      }
    }

    function updateProgress() {
      const percent = Math.round(((currentPage - 1) / (totalPages - 1)) * 100);
      document.getElementById('progress').style.width = percent + '%';
      document.getElementById('pageCounter').textContent = `${currentPage} / ${totalPages}`;
    }

    function nextPage() {
      if (currentPage < totalPages) {
        currentPage++;
        window.scrollBy({ top: window.innerHeight * 0.9, behavior: 'smooth' });
        updateProgress();
      }
    }

    function prevPage() {
      if (currentPage > 1) currentPage--;
      updateProgress();
    }

    function nextChapter() { alert('Solo tienes el capítulo 1 por ahora'); }
    function prevChapter() { alert('Solo tienes el capítulo 1 por ahora'); }

    function goBack() {
      window.location.href = 'manga-detail.html?id=21';
    }

    let lastScrollY = window.scrollY;
    window.addEventListener('scroll', () => {
      const currentScrollY = window.scrollY;
      const header = document.getElementById('header');
      const footer = document.getElementById('footer');

      if (currentScrollY > lastScrollY && currentScrollY > 100) {
        header.classList.add('hidden');
        footer.classList.add('hidden');
      } else {
        header.classList.remove('hidden');
        footer.classList.remove('hidden');
      }
      lastScrollY = currentScrollY;

      const pages = document.querySelectorAll('#pages img');
      let visibleIndex = 1;
      pages.forEach((img, index) => {
        const rect = img.getBoundingClientRect();
        if (rect.top <= window.innerHeight / 2) visibleIndex = index + 1;
      });
      currentPage = visibleIndex;
      updateProgress();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') nextPage();
      if (e.key === 'ArrowLeft') prevPage();
    });

    window.addEventListener('load', () => {
      document.getElementById('chapterInfo').innerHTML = `Capítulo <strong>1</strong>`;
      renderPages();
      updateProgress();
    });
  </script>
</body>
</html>
