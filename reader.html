<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MangaVerse - Lector</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background:#0a0f1c; margin:0; padding:0; overflow-x:hidden; }
    .reader-header {
      position:fixed; top:0; left:0; right:0; background:#0f172a; z-index:1000;
      padding:0.8rem 2rem; display:flex; align-items:center; gap:1rem; border-bottom:1px solid #334155;
    }
    .reader-main { margin-top:65px; padding:20px; max-width:1000px; margin-left:auto; margin-right:auto; }
    .page-container { display:flex; flex-direction:column; gap:20px; align-items:center; }
    .page-container img {
      max-width:100%; width:100%; max-height:92vh; object-fit:contain; border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,0.6);
    }
    .reader-footer {
      position:fixed; bottom:0; left:0; right:0; background:#0f172a; padding:1rem 2rem;
      display:flex; justify-content:space-between; align-items:center; border-top:1px solid #334155; z-index:1000;
    }
    .progress-bar { height:6px; background:#334155; border-radius:9999px; overflow:hidden; flex:1; margin:0 1rem; }
    .progress { height:100%; background:#e11d48; width:0%; transition:width 0.3s; }
    .btn-control { background:#1e2937; color:#e2e8f0; border:none; padding:10px 16px; border-radius:8px; cursor:pointer; font-size:1.1rem; }
    .btn-control:hover { background:#e11d48; }
  </style>
</head>
<body>

  <div class="reader-header">
    <a href="#" onclick="goBack()" class="btn-control"><i class="fas fa-arrow-left"></i></a>
    <div>
      <h2 id="mangaTitle" style="margin:0; font-size:1.4rem;">El Mago Pastor</h2>
      <p id="chapterInfo" style="margin:0; color:#94a3b8; font-size:0.95rem;"></p>
    </div>
    <div style="margin-left:auto; display:flex; align-items:center; gap:1rem;">
      <button onclick="prevPage()" class="btn-control"><i class="fas fa-chevron-left"></i></button>
      <span id="pageCounter" style="font-weight:600; min-width:80px; text-align:center;">1 / 59</span>
      <button onclick="nextPage()" class="btn-control"><i class="fas fa-chevron-right"></i></button>
    </div>
  </div>

  <div class="reader-main">
    <div id="pages" class="page-container"></div>
  </div>

  <div class="reader-footer">
    <button onclick="prevChapter()" class="btn-control"><i class="fas fa-step-backward"></i> Cap. anterior</button>
    <div class="progress-bar"><div id="progress" class="progress"></div></div>
    <button onclick="nextChapter()" class="btn-control">Cap. siguiente <i class="fas fa-step-forward"></i></button>
  </div>

  <script>
    const mangaFolder = "El_mago_pastor";   // ← carpeta exacta que descomprimiste
    let chapter = 1;                        // por ahora solo tienes Cap_001
    let currentPage = 1;
    const totalPages = 59;                  // número exacto de imágenes en Cap_001

    function pad(num) {
      return String(num).padStart(3, '0');
    }

    function renderPages() {
      const container = document.getElementById('pages');
      container.innerHTML = '';
      const chapterPadded = pad(chapter);

      for (let i = 1; i <= totalPages; i++) {
        const pagePadded = pad(i);
        const img = document.createElement('img');
        img.src = `${mangaFolder}/Cap_${chapterPadded}/${pagePadded}.jpg`;
        img.alt = `Página ${i}`;
        img.onerror = () => { img.style.display = 'none'; }; // por si falta alguna imagen
        container.appendChild(img);
      }
    }

    function updateProgress() {
      const percent = Math.round(((currentPage - 1) / (totalPages - 1)) * 100);
      document.getElementById('progress').style.width = percent + '%';
      document.getElementById('pageCounter').textContent = `${currentPage} / ${totalPages}`;
    }

    function nextPage() {
      if (currentPage < totalPages) {
        currentPage++;
        window.scrollBy({ top: window.innerHeight * 0.85, behavior: 'smooth' });
        updateProgress();
      }
    }

    function prevPage() {
      if (currentPage > 1) currentPage--;
      updateProgress();
    }

    function nextChapter() { alert('Solo tienes el capítulo 1 por ahora'); }
    function prevChapter() { alert('Solo tienes el capítulo 1 por ahora'); }

    function goBack() {
      window.location.href = 'mangas.html'; // o manga-detail.html cuando lo agregues
    }

    // Scroll detecta página actual
    window.addEventListener('scroll', () => {
      const pages = document.querySelectorAll('#pages img');
      let visibleIndex = 1;
      pages.forEach((img, index) => {
        const rect = img.getBoundingClientRect();
        if (rect.top <= window.innerHeight / 2) visibleIndex = index + 1;
      });
      currentPage = visibleIndex;
      updateProgress();
    });

    // Teclas flecha
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') nextPage();
      if (e.key === 'ArrowLeft') prevPage();
    });

    // Cargar al abrir
    window.addEventListener('load', () => {
      document.getElementById('chapterInfo').innerHTML = `Capítulo <strong>1</strong>`;
      renderPages();
      updateProgress();
    });
  </script>
</body>
</html>
