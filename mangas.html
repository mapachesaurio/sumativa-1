<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MangaVerse - Catálogo</title>
  <link rel="icon" type="image/png" href="https://i.ibb.co/fzV7DzWC/Copilot-20260424-215841.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo">Manga<span>Verse</span></a>
      <div class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="mangas.html" class="active">Mangas</a>
        <a href="auth.html" id="auth-link">Iniciar Sesión</a>
      </div>
    </nav>
  </header>

  <main class="main-content">
  <h1 class="manga-titulo">Catálogo de Mangas</h1>
  <input type="text" id="searchInput" placeholder="Buscar manga por título...">

  <div class="filters">
    <button class="active" onclick="applyFilter('all')">Todos</button>
    <button onclick="applyFilter('popular')">Más Populares</button>
    <button onclick="applyFilter('recent')">Recientes</button>
    <button onclick="applyFilter('rating')">Mejor Valorados</button>
  </div>

  <div id="resultsCount"></div>
  <div id="mangaGrid" class="manga-grid"></div>
</main>

  <script src="data/mangas.js"></script>
  <script>
    let currentSearch = "";
    let currentFilter = "all";

    function applyFilter(type) {
      currentFilter = type;
      document.querySelectorAll(".filters button").forEach(btn => btn.classList.remove("active"));
      event.target.classList.add("active");
      renderMangas();
    }

    function renderMangas() {
      let filtered = mangasData.mangas;

      if (currentSearch) {
        filtered = filtered.filter(m => m.title.toLowerCase().includes(currentSearch.toLowerCase()));
      }

      if (currentFilter === "popular") {
        filtered = filtered.sort((a,b) => b.chapters_count - a.chapters_count);
      } else if (currentFilter === "recent") {
        filtered = filtered.sort((a,b) => b.id - a.id);
      } else if (currentFilter === "rating") {
        filtered = filtered.sort((a,b) => b.rating - a.rating);
      }

      document.getElementById("resultsCount").textContent = `Mostrando ${filtered.length} mangas`;

      const grid = document.getElementById("mangaGrid");
      grid.innerHTML = filtered.map(m => `
        <div class="manga-card" onclick="window.location.href = 'manga-detail.html?id=${m.id}'">
          <img src="${m.cover}" alt="${m.title}">
          <div class="manga-info">
            <h3>${m.title}</h3>
            <div class="genre">${m.genre}</div>
            <div class="rating">★ ${m.rating}</div>
            <div class="chapters">${m.chapters_count} capítulos</div>
          </div>
        </div>
      `).join('');
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
      currentSearch = e.target.value;
      renderMangas();
    });

    window.onload = renderMangas;
  </script>
</body>
</html>
