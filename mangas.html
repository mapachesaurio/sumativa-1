<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo - MangaVerse</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <nav>
      <a href="index.html" class="logo">Manga<span>Verse</span></a>
      <div class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="mangas.html" class="active">Mangas</a>
      </div>
    </nav>
  </header>

  <div class="main-content">
    <h1>Catálogo de Mangas</h1>
    <div id="mangaGrid" class="manga-grid"></div>
  </div>

  <script>
    async function loadMangas() {
      const res = await fetch('data/mangas.json');
      const data = await res.json();

      const grid = document.getElementById('mangaGrid');
      grid.innerHTML = data.mangas.map(m => `
        <div class="manga-card" onclick="location.href='manga-detail.html?id=${m.id}'">
          <img src="${m.image}" alt="${m.title}">
          <h3>${m.title}</h3>
        </div>
      `).join('');
    }

    window.onload = loadMangas;
  </script>
</body>
</html>
