<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Mago Pastor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    .detail-container {
      max-width: 1100px;
      margin: 100px auto;
      padding: 30px;
      background: #1e2937;
      border-radius: 16px;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 40px;
    }
    .cover img { width: 100%; border-radius: 12px; }
    .chapter-item {
      padding: 16px;
      background: #0f172a;
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .chapter-item:hover { background: #e11d48; }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="index.html" class="logo">Manga<span>Verse</span></a>
    </nav>
  </header>

  <div class="main-content">
    <div class="detail-container">
      <div class="cover">
        <img src="https://picsum.photos/id/1015/400/600" alt="Portada">
        <button class="btn-read" onclick="startReading()">Empezar a Leer</button>
      </div>

      <div>
        <h1>El Mago Pastor</h1>
        <p><strong>Género:</strong> Fantasía</p>
        <p><strong>Rating:</strong> 4.6 ★</p>
        <p><strong>Capítulos:</strong> 14</p>

        <h2>Capítulos disponibles</h2>
        <div id="list"></div>
      </div>
    </div>
  </div>

  <script>
    const list = document.getElementById('list');
    for (let i = 1; i <= 14; i++) {
      const div = document.createElement('div');
      div.className = 'chapter-item';
      div.innerHTML = `<strong>Capítulo ${i}</strong>`;
      div.onclick = () => window.location.href = `reader.html?id=21&chapter=${i}`;
      list.appendChild(div);
    }

    function startReading() {
      window.location.href = `reader.html?id=21&chapter=1`;
    }
  </script>
</body>
</html>
