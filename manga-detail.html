<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MangaVerse - Detalle del Manga</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    .detail-container {
      max-width: 1200px;
      margin: 100px auto 4rem;
      padding: 2rem;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 3rem;
      background: #1e2937;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .cover img {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    }
    .info h1 {
      font-size: 2.8rem;
      margin-bottom: 0.5rem;
      color: #f8fafc;
    }
    .meta {
      color: #94a3b8;
      font-size: 1.1rem;
      margin: 1rem 0;
    }
    .btn-read {
      background: #e11d48;
      color: white;
      padding: 1rem 2.5rem;
      border: none;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 2rem;
      transition: all 0.3s;
    }
    .btn-read:hover {
      background: #f43f5e;
      transform: translateY(-3px);
    }
    @media (max-width: 768px) {
      .detail-container {
        grid-template-columns: 1fr;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <nav>
      <a href="index.html" class="logo">Manga<span>Verse</span></a>
      <div class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="mangas.html">Mangas</a>
        <a href="#">Géneros</a>
        <a href="#">Popular</a>
        <a href="#">Comunidad</a>
        <a href="auth.html" id="auth-link">Iniciar Sesión</a>
      </div>
    </nav>
  </header>

  <!-- Detalle -->
  <div class="detail-container">
    <div class="cover">
      <img id="mangaCover" src="" alt="Portada">
    </div>
    <div class="info">
      <h1 id="mangaTitle"></h1>
      <p class="meta" id="mangaGenre"></p>
      <p class="meta" id="mangaRating"></p>
      <p class="meta" id="mangaChapters"></p>
      <p class="meta" id="mangaViews"></p>
      
      <button class="btn-read" onclick="startReading()">
        <i class="fas fa-book-open"></i> Empezar a Leer
      </button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <h2>MangaVerse</h2>
      <p>Tu plataforma favorita para leer mangas online gratis.</p>
      <p>&copy; 2026 MangaVerse. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script>
    // Datos de mangas (mismo array)
    const mangasData = [
      { id: 1, title: "Solo Leveling", genre: "acción", rating: 4.8, chapters: 179, views: 15000, type: "popular", image: "images/solo leveling.jpg" },
      { id: 2, title: "Jujutsu Kaisen", genre: "acción", rating: 4.7, chapters: 245, views: 12000, type: "popular", image: "images/jujutsu.jpg" },
      { id: 3, title: "One Piece", genre: "aventura", rating: 4.9, chapters: 1090, views: 25000, type: "popular", image: "images/one piece.jpg" },
      { id: 4, title: "Chainsaw Man", genre: "acción", rating: 4.6, chapters: 167, views: 9800, type: "popular", image: "images/csm.jpg" },
      { id: 5, title: "Demon Slayer", genre: "acción", rating: 4.7, chapters: 205, views: 11000, type: "top-rated", image: "images/demon slayer.jpg" },
      { id: 6, title: "My Hero Academia", genre: "shonen", rating: 4.5, chapters: 390, views: 10500, type: "popular", image: "images/my hero academia.jpg" },
      { id: 7, title: "Attack on Titan", genre: "drama", rating: 4.9, chapters: 139, views: 20000, type: "top-rated", image: "images/snk.jpg" },
      { id: 8, title: "Naruto", genre: "aventura", rating: 4.8, chapters: 700, views: 18000, type: "popular", image: "images/naruto.jpg" },
      { id: 9, title: "Tokyo Revengers", genre: "drama", rating: 4.4, chapters: 278, views: 8500, type: "recent", image: "images/tokyo revengers.jpg" },
      { id: 10, title: "Spy x Family", genre: "comedia", rating: 4.7, chapters: 89, views: 9200, type: "recent", image: "images/spy x famili.jpg" },
      { id: 11, title: "One Punch Man", genre: "comedia", rating: 4.6, chapters: 190, views: 9500, type: "popular", image: "images/opm.jpg" },
      { id: 12, title: "Hunter x Hunter", genre: "aventura", rating: 4.8, chapters: 400, views: 10200, type: "top-rated", image: "images/hxh.jpg" },
      { id: 13, title: "Blue Lock", genre: "deportes", rating: 4.5, chapters: 245, views: 7800, type: "recent", image: "images/blue lock.jpg" },
      { id: 14, title: "Vinland Saga", genre: "seinen", rating: 4.8, chapters: 205, views: 8200, type: "top-rated", image: "images/vinland saga.jpg" },
      { id: 15, title: "Berserk", genre: "seinen", rating: 4.9, chapters: 364, views: 13000, type: "top-rated", image: "images/berserk.jpg" },
      { id: 16, title: "Frieren", genre: "fantasía", rating: 4.7, chapters: 118, views: 7500, type: "recent", image: "images/frieren.jpg" },
      { id: 17, title: "Oshi no Ko", genre: "drama", rating: 4.6, chapters: 150, views: 8000, type: "recent", image: "images/oshi no ko.jpg" },
      { id: 18, title: "Kaiju No. 8", genre: "acción", rating: 4.5, chapters: 95, views: 7200, type: "recent", image: "images/kaiju n.8.jpg" },
      { id: 19, title: "Dandadan", genre: "comedia", rating: 4.6, chapters: 124, views: 7000, type: "recent", image: "images/dandadan.jpg" },
      { id: 20, title: "Tower of God", genre: "fantasía", rating: 4.5, chapters: 590, views: 8800, type: "popular", image: "images/tower of god.jpg" }
    ];

    function getMangaById(id) {
      return mangasData.find(m => m.id === parseInt(id));
    }

    const urlParams = new URLSearchParams(window.location.search);
    const mangaId = urlParams.get('id');

    if (!mangaId) {
      document.body.innerHTML = `<h2 style="text-align:center; margin-top:150px; color:#e11d48;">Manga no encontrado</h2>`;
    } else {
      const manga = getMangaById(mangaId);
      if (manga) {
        document.getElementById('mangaTitle').textContent = manga.title;
        document.getElementById('mangaGenre').innerHTML = `<strong>Género:</strong> ${manga.genre.charAt(0).toUpperCase() + manga.genre.slice(1)}`;
        document.getElementById('mangaRating').innerHTML = `<strong>Rating:</strong> ${manga.rating} ★`;
        document.getElementById('mangaChapters').innerHTML = `<strong>Capítulos:</strong> ${manga.chapters}`;
        document.getElementById('mangaViews').innerHTML = `<strong>Vistas:</strong> ${manga.views.toLocaleString()}`;
        document.getElementById('mangaCover').src = manga.image;
        document.getElementById('mangaCover').alt = manga.title;
      } else {
        document.body.innerHTML = `<h2 style="text-align:center; margin-top:150px; color:#e11d48;">Manga no encontrado</h2>`;
      }
    }

    function startReading() {
      alert("Iniciando lector de capítulos... (Aquí iría el lector real en el futuro)");
      // window.location.href = `reader.html?id=${mangaId}&chapter=1`; // futuro
    }

    // Auth nav
    function updateAuthNav() {
      const currentUser = JSON.parse(localStorage.getItem('currentUser'));
      const authLink = document.getElementById('auth-link');
      if (currentUser) {
        authLink.innerHTML = `${currentUser.username || currentUser.email} <i class="fas fa-sign-out-alt"></i>`;
        authLink.href = '#';
        authLink.onclick = (e) => {
          e.preventDefault();
          if (confirm('¿Cerrar sesión?')) {
            localStorage.removeItem('currentUser');
            window.location.reload();
          }
        };
      } else {
        authLink.textContent = 'Iniciar Sesión';
        authLink.href = 'auth.html';
        authLink.onclick = null;
      }
    }
    window.addEventListener('load', updateAuthNav);
  </script>
</body>
</html>
