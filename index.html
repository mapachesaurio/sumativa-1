<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Landing Page</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    header {
      background: #4CAF50;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .hero {
      padding: 60px 20px;
      text-align: center;
      background: #f4f4f4;
    }

    .hero h1 {
      margin-bottom: 10px;
    }

    .hero p {
      margin-bottom: 20px;
    }

    .btn {
      background: #4CAF50;
      color: white;
      padding: 12px 20px;
      text-decoration: none;
      border-radius: 5px;
    }

    .features {
      display: flex;
      flex-wrap: wrap;
      padding: 20px;
      text-align: center;
    }

    .feature {
      flex: 1;
      padding: 20px;
      min-width: 250px;
    }

    footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h2>Mi Marca</h2>
  </header>

  <section class="hero">
    <h1>Bienvenido a tu solución ideal</h1>
    <p>Explica aquí qué problema resuelves y por qué eres diferente.</p>
    <a href="#" class="btn">Comenzar</a>
  </section>

  <section class="features">
    <div class="feature">
      <h3>Rápido</h3>
      <p>Descripción breve de esta ventaja.</p>
    </div>
    <div class="feature">
      <h3>Fácil</h3>
      <p>Descripción breve de esta ventaja.</p>
    </div>
    <div class="feature">
      <h3>Seguro</h3>
      <p>Descripción breve de esta ventaja.</p>
    </div>
  </section>

  <footer>
    <p>© 2026 Mi Marca - Todos los derechos reservados</p>
  </footer>

</body>
</html>
